<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PeerPrep helps students find study groups, plan sessions in a live chat and work through problems together on a shared whiteboard." />
    <meta name="theme-color" content="#F5F7FB" />
    <title>PeerPrep — Study together, prepare better</title>

    <!-- Apply the saved (or system) theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        var theme = "light"
        try {
          var saved = localStorage.getItem("peerprep-theme")
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          theme = saved === "dark" || saved === "light" ? saved : prefersDark ? "dark" : "light"
        } catch (e) {}
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#060A14" : "#F5F7FB")
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
