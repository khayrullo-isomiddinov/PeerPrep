# Render Blueprint: defines the backend API.
# Values marked "sync: false" are secrets/URLs you enter in the Render dashboard when applying it.
services:
  - type: web
    name: peerprep-api-eu
    runtime: python
    plan: free
    # Same region as the Neon database (aws-eu-central-1), so queries don't cross the Atlantic
    region: frankfurt
    rootDir: back
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Vercel preview/deployment URLs for this account only
      - key: CORS_ORIGIN_REGEX
        value: ^https://peer-prep-[a-z0-9-]+-khayrullo-isomiddinovs-projects\.vercel\.app$
      - key: BACKEND_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Until email sending works on the server, sign-up shows the verification link on screen.
      # Set to "false" once verification emails are delivered.
      - key: VERIFY_LINK_FALLBACK
        value: "true"
      - key: OPENAI_API_KEY
        sync: false

# The frontend is hosted on Vercel (see front/vercel.json)
